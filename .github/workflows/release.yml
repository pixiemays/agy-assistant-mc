name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build NeoForge mod
        working-directory: mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: mod/build/libs/agyassistant-*.jar

  build-bridge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build agy-bridge.exe
        working-directory: bridge
        shell: pwsh
        run: ./build_exe.ps1

      - name: Upload bridge exe
        uses: actions/upload-artifact@v4
        with:
          name: bridge-exe
          path: bridge/dist/agy-bridge.exe

  release:
    needs: [build-mod, build-bridge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mod-jar
          path: dist-assets

      - uses: actions/download-artifact@v4
        with:
          name: bridge-exe
          path: dist-assets

      - name: Package zip bundles
        run: |
          mkdir -p bundle-direct bundle-full
          cp install.bat install.ps1 dist-assets/agyassistant-loader.jar bundle-direct/
          cp install.bat install.ps1 dist-assets/agyassistant-loader.jar dist-assets/agy-bridge.exe bundle-full/
          (cd bundle-direct && zip -r ../dist-assets/agy-assistant-direct.zip .)
          (cd bundle-full && zip -r ../dist-assets/agy-assistant-full-windows.zip .)
          ls -lh dist-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: AGY Assistant ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist-assets/agy-assistant-direct.zip
            dist-assets/agy-assistant-full-windows.zip
            dist-assets/agyassistant-*.jar
            dist-assets/agy-bridge.exe
