[project]
name = "agy-bridge"
version = "0.1.0"
description = "Local HTTP/SSE bridge between Minecraft 1.21.1 NeoForge mod and Google Antigravity SDK"
requires-python = ">=3.11"
dependencies = [
    "google-antigravity",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.11.0",
]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[project.scripts]
agy-bridge = "agy_bridge.main:run_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agy_bridge"]
